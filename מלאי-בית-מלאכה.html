<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול מלאי בית מלאכה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');
  :root {
    --bg: #0f1117; --surface: #181c27; --surface2: #1e2333; --border: #2a3045;
    --accent: #4f8ef7; --accent2: #2dd4bf; --warn: #f59e0b; --danger: #ef4444;
    --success: #22c55e; --text: #e8eaf0; --text2: #8b92a8; --text3: #555e78;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; }
  .app { display:flex; flex-direction:column; min-height:100vh; }
  header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:0 24px; display:flex; align-items:center; justify-content:space-between;
    height:60px; position:sticky; top:0; z-index:100;
  }
  .logo { font-size:17px; font-weight:600; }
  .logo span { color:var(--accent); }
  .sync-btn {
    background:var(--surface2); border:1px solid var(--border); border-radius:20px;
    padding:5px 14px; font-size:13px; color:var(--text2); cursor:pointer;
    transition:all 0.2s; font-family:inherit;
  }
  .sync-btn:hover { border-color:var(--accent); color:var(--accent); }
  .sync-btn.loading { color:var(--accent); border-color:var(--accent); }
  nav {
    display:flex; gap:2px; background:var(--surface);
    border-bottom:1px solid var(--border); padding:0 16px; overflow-x:auto;
  }
  nav button {
    background:none; border:none; color:var(--text2); padding:14px 18px;
    cursor:pointer; font-family:inherit; font-size:14px; font-weight:500;
    border-bottom:2px solid transparent; white-space:nowrap; transition:all 0.2s;
  }
  nav button.active { color:var(--accent); border-bottom-color:var(--accent); }
  nav button:hover:not(.active) { color:var(--text); }
  main { flex:1; padding:24px; max-width:900px; margin:0 auto; width:100%; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
  .card-title { font-size:13px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; }
  .stat-num { font-size:28px; font-weight:700; line-height:1; margin-bottom:4px; }
  .stat-label { font-size:12px; color:var(--text2); }
  .stat.warn { border-color:var(--warn); }
  .stat.warn .stat-num { color:var(--warn); }
  .stat.ok .stat-num { color:var(--success); }
  .stat.info .stat-num { color:var(--accent); }
  .alert { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:8px; margin-bottom:8px; font-size:14px; }
  .alert.danger { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; }
  .alert.warn { background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); color:#fcd34d; }
  .alert-icon { font-size:18px; flex-shrink:0; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:right; padding:10px 12px; color:var(--text3); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; border-bottom:1px solid var(--border); }
  td { padding:12px 12px; border-bottom:1px solid rgba(42,48,69,0.5); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(255,255,255,0.02); }
  .stock-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .stock-badge.ok { background:rgba(34,197,94,0.15); color:var(--success); }
  .stock-badge.low { background:rgba(245,158,11,0.15); color:var(--warn); }
  .stock-badge.empty { background:rgba(239,68,68,0.15); color:var(--danger); }
  .type-badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
  .type-badge.free { background:rgba(79,142,247,0.15); color:var(--accent); }
  .type-badge.managed { background:rgba(45,212,191,0.15); color:var(--accent2); }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:8px; border:none; cursor:pointer; font-family:inherit; font-size:14px; font-weight:500; transition:all 0.2s; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#3d7ee8; }
  .btn-success { background:var(--success); color:#fff; }
  .btn-success:hover { background:#16a34a; }
  .btn-ghost { background:var(--surface2); border:1px solid var(--border); color:var(--text); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
  .btn-danger { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:var(--danger); }
  .form-group { margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; font-weight:500; }
  input, select, textarea { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; color:var(--text); font-family:inherit; font-size:14px; outline:none; transition:border-color 0.2s; }
  input:focus, select:focus { border-color:var(--accent); }
  select option { background:var(--surface2); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .log-item { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(42,48,69,0.5); font-size:13px; }
  .log-item:last-child { border-bottom:none; }
  .log-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .log-dot.free { background:var(--accent); }
  .log-dot.managed { background:var(--accent2); }
  .log-time { color:var(--text3); font-size:12px; min-width:90px; }
  .log-text { flex:1; color:var(--text2); }
  .log-text strong { color:var(--text); }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.show { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:440px; animation:slideUp 0.25s ease; }
  .modal-title { font-size:17px; font-weight:600; margin-bottom:18px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  .empty { text-align:center; padding:48px 24px; color:var(--text3); }
  .empty-icon { font-size:40px; margin-bottom:12px; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--success); color:#fff; padding:12px 24px; border-radius:30px; font-size:14px; font-weight:500; z-index:999; transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1); display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .toast.error { background:var(--danger); }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; align-items:center; justify-content:center; }
  .loading-overlay.show { display:flex; }
  .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .log-filter-btn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 18px; color:var(--text2); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; transition:all 0.2s; }
  .log-filter-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .nfc-url-box { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:12px; color:var(--text2); word-break:break-all; margin-top:8px; }
  @media(max-width:600px) { main{padding:16px} .form-row{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)} }
  .login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .login-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px; width:100%; max-width:360px; text-align:center; }
  .login-logo { font-size:48px; margin-bottom:16px; }
  .login-title { font-size:20px; font-weight:700; margin-bottom:4px; }
  .login-sub { color:var(--text2); font-size:14px; margin-bottom:24px; }
  .login-box input { margin-bottom:12px; text-align:center; font-size:18px; letter-spacing:4px; }
  .login-box .btn-primary { width:100%; justify-content:center; padding:12px; font-size:16px; }
  .login-error { color:var(--danger); font-size:13px; margin-top:8px; min-height:20px; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🔧</div>
    <div class="login-title">ניהול מלאי בית מלאכה</div>
    <div class="login-sub">הכנס סיסמה להמשך</div>
    <input type="password" id="passwordInput" placeholder="סיסמה" onkeydown="if(event.key==='Enter')checkPassword()" />
    <button class="btn btn-primary" onclick="checkPassword()">כניסה</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">
  <header>
    <div class="logo">ניהול מלאי <span>בית מלאכה</span></div>
    <button class="sync-btn" id="syncBtn" onclick="loadItems()">↻ רענן</button>
  </header>
  <nav>
    <button class="active" onclick="showTab('inventory',this)">מלאי</button>
    <button onclick="showTab('log',this)">יומן</button>
    <button onclick="showTab('alerts',this)" id="alertsTab">התראות</button>
    <button onclick="showTab('admin',this)">ניהול</button>
  </nav>
  <main>

    <!-- INVENTORY -->
    <div class="tab-content active" id="tab-inventory">
      <div class="stats">
        <div class="stat info"><div class="stat-num" id="totalItems">—</div><div class="stat-label">פריטים</div></div>
        <div class="stat ok"><div class="stat-num" id="okItems">—</div><div class="stat-label">תקין</div></div>
        <div class="stat warn"><div class="stat-num" id="lowItems">—</div><div class="stat-label">מלאי נמוך</div></div>
        <div class="stat warn"><div class="stat-num" id="emptyItems">—</div><div class="stat-label">אזל</div></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div class="card-title" style="margin-bottom:0">פריטים במלאי</div>
          <select id="filterType" onchange="renderInventory()" style="width:auto;padding:6px 10px;font-size:13px">
            <option value="">הכל</option>
            <option value="free">חופשי</option>
            <option value="managed">מנוהל</option>
          </select>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>פריט</th><th>סוג</th><th>מלאי</th><th>מינימום</th><th>סטטוס</th></tr></thead>
          <tbody id="inventoryBody"><tr><td colspan="5" style="text-align:center;color:var(--text3);padding:32px">טוען...</td></tr></tbody></table>
        </div>
      </div>
    </div>

    <!-- LOG -->
    <div class="tab-content" id="tab-log">
      <div class="card">
        <div style="display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
          <button class="log-filter-btn active" id="filterFree" onclick="setLogFilter('free',this)">חופשי</button>
          <button class="log-filter-btn" id="filterManaged" onclick="setLogFilter('managed',this)">מנוהל</button>
          <div style="flex:1"></div>
          <select id="printFilter" style="width:auto;padding:6px 10px;font-size:13px">
            <option value="all">הכל</option>
            <option value="free">חופשי</option>
            <option value="managed">מנוהל</option>
          </select>
          <button class="btn btn-ghost" onclick="printLog()">🖨️ הדפס דוח</button>
        </div>
        <div id="logList"><div class="empty"><div class="empty-icon">📋</div>טוען...</div></div>
      </div>
    </div>

    <!-- ALERTS -->
    <div class="tab-content" id="tab-alerts">
      <div class="card">
        <div class="card-title">התראות מלאי</div>
        <div id="alertsList"></div>
      </div>
    </div>

    <!-- ADMIN -->
    <div class="tab-content" id="tab-admin">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div class="card-title" style="margin-bottom:0">ניהול פריטים</div>
          <button class="btn btn-primary" onclick="openAddModal()">+ הוסף פריט</button>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>פריט</th><th>סוג</th><th>מלאי</th><th>NFC</th><th>פעולות</th></tr></thead>
          <tbody id="adminBody"></tbody></table>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">הוספת פריט חדש</div>
    <div class="form-row">
      <div class="form-group"><label>שם פריט</label><input type="text" id="newName" placeholder="שם הפריט..." /></div>
      <div class="form-group"><label>סוג</label>
        <select id="newType"><option value="free">חופשי (טכנאי)</option><option value="managed">מנוהל (הנהלה)</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>כמות במלאי</label><input type="number" id="newQty" value="10" min="0" /></div>
      <div class="form-group"><label>מינימום להתראה</label><input type="number" id="newMin" value="3" min="1" /></div>
    </div>
    <div class="form-group"><label>תיאור</label><input type="text" id="newDesc" placeholder="תיאור קצר..." /></div>
    <div class="form-group"><label>קטגוריה</label><input type="text" id="newCategory" placeholder="מכונת קרח, חדר קירור..." /></div>
    <div class="form-group"><label>אמוג'י</label><input type="text" id="newEmoji" placeholder="❄️" maxlength="2" /></div>
    <div class="form-group"><label>מק"ט</label><input type="text" id="newSku" placeholder="מספר קטלוגי..." /></div>
    <div class="form-group"><label>קישור תמונה (מ-imgbb.com)</label><input type="text" id="newImage" placeholder="https://i.ibb.co/..." /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAddModal()">ביטול</button>
      <button class="btn btn-primary" onclick="addItem()">הוסף</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="restockModal">
  <div class="modal">
    <div class="modal-title">עריכת פריט – <span id="restockItemName"></span></div>
    <div class="form-row">
      <div class="form-group"><label>שם</label><input type="text" id="editName" /></div>
      <div class="form-group"><label>סוג</label>
        <select id="editType"><option value="free">חופשי</option><option value="managed">מנוהל</option></select>
      </div>
    </div>
    <div class="form-group"><label>תיאור</label><input type="text" id="editDesc" /></div>
    <div class="form-group"><label>קטגוריה</label><input type="text" id="editCategory" /></div>
    <div class="form-row">
      <div class="form-group"><label>כמות</label><input type="number" id="restockQty" min="0" /></div>
      <div class="form-group"><label>מינימום</label><input type="number" id="editMin" min="1" /></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>אמוג'י</label><input type="text" id="editEmoji" maxlength="2" /></div>
      <div class="form-group"><label>מק"ט</label><input type="text" id="restockSku" /></div>
    </div>
    <div class="form-group"><label>קישור תמונה</label><input type="text" id="restockImage" placeholder="https://i.ibb.co/..." /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeRestockModal()">ביטול</button>
      <button class="btn btn-success" onclick="confirmRestock()">שמור</button>
    </div>
  </div>
</div>

<!-- NFC MODAL -->
<div class="modal-overlay" id="nfcModal">
  <div class="modal">
    <div class="modal-title">קישור NFC – <span id="nfcItemName"></span></div>
    <p style="color:var(--text2);font-size:14px;margin-bottom:12px">צרוב את הקישור הזה על מדבקת NFC באפליקציית NFC Tools:</p>
    <div class="nfc-url-box" id="nfcUrl"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeNfcModal()">סגור</button>
      <button class="btn btn-primary" onclick="copyNfcUrl()">העתק קישור</button>
    </div>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">✓ <span id="toastMsg"></span></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwJ67H0uLn8_MoL3qJTg475HuO9Xi3irBOYkqzH5S2CjNtC6ZAdC6uAMobU8Ml3MrndLg/exec';
// דף טכנאי
const TECH_BASE = 'https://yossivogel2.github.io/workshop-inventory/טכנאי.html';

let items = [];
let logData = [];
let logFilter = 'free';
let restockItemId = null;
let nfcItemId = null;

// ---- INIT ----
// loadItems called after login
setInterval(() => { if(document.getElementById("mainApp").style.display !== "none") loadItems(); }, 300000);

async function loadItems() {
  const btn = document.getElementById('syncBtn');
  btn.textContent = '↻ טוען...';
  btn.classList.add('loading');
  try {
    const res = await fetch(SCRIPT_URL + '?action=getItems');
    const raw = await res.json();
    // raw[0] = headers, raw[1+] = data
    items = raw.slice(1).map(r => ({
      id: r[0], name: r[1], type: r[2], desc: r[3],
      category: r[4], qty: parseInt(r[5]) || 0,
      min: parseInt(r[6]) || 3, emoji: r[7] || '📦',
      image: r[8] || '', sku: r[9] || ''
    }));
    renderAll();
    btn.textContent = '✓ מעודכן';
    setTimeout(() => { btn.textContent = '↻ רענן'; btn.classList.remove('loading'); }, 1500);
  } catch(e) {
    btn.textContent = '↻ רענן';
    btn.classList.remove('loading');
    showToast('שגיאה בטעינה', true);
    // fallback demo data
    if (items.length === 0) {
      items = [
        {id:1,name:'פילטר מים',type:'free',desc:'פילטר סטנדרטי',category:'מכונת קרח',qty:12,min:4,emoji:'💧'},
        {id:2,name:'תרמוסטט',type:'free',desc:'תרמוסטט קירור',category:'חדר קירור',qty:2,min:4,emoji:'🌡️'},
        {id:3,name:'קומפרסור',type:'managed',desc:'להחלפה',category:'מכונת קרח',qty:1,min:2,emoji:'⚙️'},
      ];
      renderAll();
    }
  }
}

function renderAll() {
  renderInventory();
  renderAlerts();
  renderAdmin();
  updateStats();
}

// ---- TABS ----
function showTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  if (name === 'log') loadLog();
}

// ---- INVENTORY ----
function renderInventory() {
  const filter = document.getElementById('filterType')?.value || '';
  const filtered = filter ? items.filter(i => i.type === filter) : items;
  document.getElementById('inventoryBody').innerHTML = filtered.length === 0
    ? '<tr><td colspan="5" style="text-align:center;color:var(--text3);padding:32px">אין פריטים</td></tr>'
    : filtered.map(item => `
      <tr>
        <td><span style="margin-left:8px">${item.emoji}</span><strong>${item.name}</strong><br><span style="color:var(--text3);font-size:12px">${item.category}</span>${item.sku ? '<br><span style="color:var(--text3);font-size:11px">מק&quot;ט: '+item.sku+'</span>' : ''}</td>
        <td><span class="type-badge ${item.type}">${item.type==='free'?'חופשי':'מנוהל'}</span></td>
        <td style="font-weight:700;font-size:16px">${item.qty}</td>
        <td style="color:var(--text2)">${item.min}</td>
        <td><span class="stock-badge ${getStockClass(item)}">${getStockLabel(item)}</span></td>
      </tr>`).join('');
  updateStats();
}

function updateStats() {
  document.getElementById('totalItems').textContent = items.length;
  document.getElementById('okItems').textContent = items.filter(i => i.qty > i.min).length;
  document.getElementById('lowItems').textContent = items.filter(i => i.qty > 0 && i.qty <= i.min).length;
  document.getElementById('emptyItems').textContent = items.filter(i => i.qty === 0).length;
  const alertCount = items.filter(i => i.qty <= i.min).length;
  const tab = document.getElementById('alertsTab');
  tab.textContent = alertCount > 0 ? `התראות (${alertCount})` : 'התראות';
  tab.style.color = alertCount > 0 ? 'var(--warn)' : '';
}

function getStockClass(item) { return item.qty===0?'empty':item.qty<=item.min?'low':'ok'; }
function getStockLabel(item) { return item.qty===0?'⛔ אזל':item.qty<=item.min?'⚠️ נמוך':'✓ תקין'; }

// ---- LOG ----
async function loadLog() {
  document.getElementById('logList').innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>טוען...</div>';
  try {
    const res = await fetch(SCRIPT_URL + '?action=getLog');
    const raw = await res.json();
    logData = raw.slice(1).reverse();
    renderLog();
  } catch(e) {
    document.getElementById('logList').innerHTML = '<div class="empty"><div class="empty-icon">📋</div>אין נתונים</div>';
  }
}

function formatDate(raw) {
  if (!raw) return '';
  if (typeof raw === 'number') {
    const d = new Date(Math.round((raw - 25569) * 86400 * 1000));
    return d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'numeric'});
  }
  if (String(raw).includes('T')) {
    const d = new Date(raw);
    return d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'numeric'});
  }
  return raw;
}
function formatTime(raw) {
  if (!raw) return '';
  if (typeof raw === 'number') {
    const totalSec = Math.round(raw * 86400);
    const h = Math.floor(totalSec / 3600).toString().padStart(2,'0');
    const m = Math.floor((totalSec % 3600) / 60).toString().padStart(2,'0');
    return h + ':' + m;
  }
  if (String(raw).includes('T')) {
    const d = new Date(raw);
    return d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
  }
  return raw;
}
function renderLog() {
  const el = document.getElementById('logList');
  if (!logData.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>אין פעילות עדיין</div>'; return; }
  const filtered = logData.filter(l => (l[3] || 'free') === logFilter);
  if (!filtered.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>אין רשומות</div>'; return; }
  el.innerHTML = filtered.map(l => {
    const date = formatDate(l[0]);
    const time = formatTime(l[1]);
    const itemName = l[2] || '';
    const type = l[3] || 'free';
    const customer = l[4] || '';
    const who = l[5] || '';
    const dot = type === 'managed' ? 'managed' : 'free';
    return '<div class="log-item">' +
      '<div class="log-dot ' + dot + '"></div>' +
      '<div style="flex:1">' +
        '<div style="font-weight:600;font-size:14px;margin-bottom:3px">' + itemName + '</div>' +
        '<div style="font-size:12px;color:var(--text2)">' +
          (who ? who : '') +
          (customer ? ' · עבור <span style="color:var(--accent2)">' + customer + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div style="text-align:left;font-size:12px;color:var(--text3);white-space:nowrap">' +
        '<div>' + date + '</div>' +
        '<div>' + time + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function setLogFilter(type, btn) {
  logFilter = type;
  document.querySelectorAll('.log-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLog();
}

// ---- PRINT REPORT ----
function printLog() {
  const filterVal = document.getElementById('printFilter').value;
  const rows = filterVal === 'all' ? logData : logData.filter(l => (l[3] || 'free') === filterVal);
  const filterLabel = filterVal === 'all' ? 'הכל' : (filterVal === 'free' ? 'חופשי' : 'מנוהל');
  const tableRows = rows.map(l => {
    const date = formatDate(l[0]);
    const time = formatTime(l[1]);
    const itemName = l[2] || '';
    const type = (l[3] || 'free') === 'managed' ? 'מנוהל' : 'חופשי';
    const customer = l[4] || '';
    const who = l[5] || '';
    return `<tr><td>${date}</td><td>${time}</td><td>${itemName}</td><td>${type}</td><td>${who}</td><td>${customer}</td></tr>`;
  }).join('');
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>דוח יומן – ${filterLabel}</title>
<style>
  body { font-family: Arial, sans-serif; padding: 24px; direction: rtl; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #555; font-size: 13px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: right; }
  th { background: #f0f0f0; }
</style>
</head>
<body>
  <h1>דוח יומן פעילות – ${filterLabel}</h1>
  <div class="sub">הופק בתאריך ${new Date().toLocaleDateString('he-IL')} · ${rows.length} רשומות</div>
  <table>
    <thead><tr><th>תאריך</th><th>שעה</th><th>פריט</th><th>סוג</th><th>מבצע</th><th>לקוח</th></tr></thead>
    <tbody>${tableRows || '<tr><td colspan="6" style="text-align:center">אין נתונים</td></tr>'}</tbody>
  </table>
</body>
</html>`);
  win.document.close();
  win.focus();
  win.print();
}

// ---- ALERTS ----
function renderAlerts() {
  const el = document.getElementById('alertsList');
  const alerts = items.filter(i => i.qty <= i.min);
  if (!alerts.length) { el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>אין התראות פעילות</div>'; return; }
  el.innerHTML = alerts.map(item => `
    <div class="alert ${item.qty===0?'danger':'warn'}">
      <span class="alert-icon">${item.emoji}</span>
      <div style="flex:1">
        <strong>${item.name}</strong> – ${item.qty===0?'אזל מהמלאי':`נותרו ${item.qty} יחידות (מינימום: ${item.min})`}
        <div style="font-size:12px;opacity:0.7;margin-top:2px">${item.category}</div>
      </div>
      <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="openRestock(${item.id})">עדכן מלאי</button>
    </div>`).join('');
}

// ---- ADMIN ----
function renderAdmin() {
  const body = document.getElementById('adminBody');
  body.innerHTML = items.map(item => `
    <tr>
      <td><span style="margin-left:6px">${item.emoji}</span>${item.name}<br><span style="color:var(--text3);font-size:12px">${item.category}</span></td>
      <td><span class="type-badge ${item.type}">${item.type==='free'?'חופשי':'מנוהל'}</span></td>
      <td style="font-weight:700">${item.qty}</td>
      <td><button class="btn btn-ghost" style="font-size:12px;padding:4px 10px" onclick="showNfc(${item.id})">📡 קישור</button></td>
      <td style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px" onclick="openRestock(${item.id})">עדכן</button>
        <button class="btn btn-danger" style="font-size:12px;padding:5px 10px" onclick="deleteItem(${item.id})">מחק</button>
      </td>
    </tr>`).join('');
}

// ---- ADD ----
function openAddModal() { document.getElementById('addModal').classList.add('show'); }
function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
async function addItem() {
  const name = document.getElementById('newName').value.trim();
  if (!name) return;
  const newItem = {
    id: Date.now(),
    name,
    type: document.getElementById('newType').value,
    qty: parseInt(document.getElementById('newQty').value)||0,
    min: parseInt(document.getElementById('newMin').value)||3,
    desc: document.getElementById('newDesc').value.trim()||name,
    category: document.getElementById('newCategory').value.trim()||'כללי',
    emoji: document.getElementById('newEmoji').value.trim()||'📦',
    sku: document.getElementById('newSku').value.trim()||'',
    image: document.getElementById('newImage').value.trim()||'',
  };
  showLoading(true);
  try {
    await fetch(`${SCRIPT_URL}?action=addItem&id=${newItem.id}&name=${encodeURIComponent(newItem.name)}&type=${newItem.type}&desc=${encodeURIComponent(newItem.desc)}&category=${encodeURIComponent(newItem.category)}&qty=${newItem.qty}&min=${newItem.min}&emoji=${encodeURIComponent(newItem.emoji)}&image=${encodeURIComponent(newItem.image||'')}&sku=${encodeURIComponent(newItem.sku||'')}`);
    items.push(newItem);
    closeAddModal();
    renderAll();
    showToast('פריט נוסף בהצלחה');
    ['newName','newDesc','newCategory','newEmoji','newSku','newImage'].forEach(id => document.getElementById(id).value='');
    document.getElementById('newQty').value=10; document.getElementById('newMin').value=3;
  } catch(e) { showToast('שגיאה בהוספה', true); }
  showLoading(false);
}

// ---- RESTOCK ----
function openRestock(id) {
  restockItemId = id;
  const item = items.find(i => i.id==id);
  document.getElementById('restockItemName').textContent = item.name;
  document.getElementById('editName').value = item.name || '';
  document.getElementById('editType').value = item.type || 'free';
  document.getElementById('editDesc').value = item.desc || '';
  document.getElementById('editCategory').value = item.category || '';
  document.getElementById('restockQty').value = item.qty;
  document.getElementById('editMin').value = item.min || 3;
  document.getElementById('editEmoji').value = item.emoji || '';
  document.getElementById('restockSku').value = item.sku || '';
  document.getElementById('restockImage').value = item.image || '';
  document.getElementById('restockModal').classList.add('show');
}
function closeRestockModal() { document.getElementById('restockModal').classList.remove('show'); }
async function confirmRestock() {
  const item = items.find(i => i.id==restockItemId);
  const qty = parseInt(document.getElementById('restockQty').value)||0;
  const name = document.getElementById('editName').value.trim();
  const type = document.getElementById('editType').value;
  const desc = document.getElementById('editDesc').value.trim();
  const category = document.getElementById('editCategory').value.trim();
  const min = parseInt(document.getElementById('editMin').value)||3;
  const emoji = document.getElementById('editEmoji').value.trim();
  const sku = document.getElementById('restockSku').value.trim();
  const image = document.getElementById('restockImage').value.trim();
  showLoading(true);
  try {
    await fetch(`${SCRIPT_URL}?action=updateItem&id=${item.id}&qty=${qty}&name=${encodeURIComponent(name)}&type=${type}&desc=${encodeURIComponent(desc)}&category=${encodeURIComponent(category)}&min=${min}&emoji=${encodeURIComponent(emoji)}&sku=${encodeURIComponent(sku)}&image=${encodeURIComponent(image)}`);
    item.qty = qty; item.name = name; item.type = type; item.desc = desc;
    item.category = category; item.min = min; item.emoji = emoji;
    item.sku = sku; item.image = image;
    closeRestockModal();
    renderAll();
    showToast('פריט עודכן: ' + name);
  } catch(e) { showToast('שגיאה בעדכון', true); }
  showLoading(false);
}

// ---- DELETE ----
async function deleteItem(id) {
  if (!confirm('למחוק פריט זה?')) return;
  showLoading(true);
  try {
    await fetch(`${SCRIPT_URL}?action=deleteItem&id=${id}`);
    items = items.filter(i => i.id!=id);
    renderAll();
    showToast('פריט נמחק');
  } catch(e) { showToast('שגיאה במחיקה', true); }
  showLoading(false);
}

// ---- NFC ----
function showNfc(id) {
  nfcItemId = id;
  const item = items.find(i => i.id==id);
  document.getElementById('nfcItemName').textContent = item.name;
  const url = 'https://yossivogel2.github.io/workshop-inventory/t.html?id=' + item.id;
  document.getElementById('nfcUrl').textContent = url;
  document.getElementById('nfcModal').classList.add('show');
}
function closeNfcModal() { document.getElementById('nfcModal').classList.remove('show'); }
function copyNfcUrl() {
  const url = document.getElementById('nfcUrl').textContent;
  navigator.clipboard.writeText(url).then(() => showToast('הקישור הועתק'));
}

// ---- UTILS ----
function showLoading(v) { document.getElementById('loadingOverlay').classList.toggle('show',v); }
function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.className = 'toast' + (err?' error':'');
  t.querySelector('span').textContent = msg;
  t.innerHTML = (err?'✗ ':'✓ ') + `<span>${msg}</span>`;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function checkPassword() {
  const pwd = document.getElementById('passwordInput').value;
  if (pwd === 'Vogel') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'flex';
    loadItems();
  } else {
    document.getElementById('loginError').textContent = 'סיסמה שגויה';
    document.getElementById('passwordInput').value = '';
  }
}
