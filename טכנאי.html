<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>מלאי בית מלאכה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap');
  :root {
    --bg: #0f1117; --surface: #181c27; --border: #2a3045;
    --accent: #4f8ef7; --success: #22c55e; --danger: #ef4444; --warn: #f59e0b;
    --text: #e8eaf0; --text2: #8b92a8;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px;
  }

  .screen { width:100%; max-width:360px; text-align:center; }

  /* LOADING */
  #screenLoading .spinner {
    width:48px; height:48px; border:3px solid var(--border);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin 0.8s linear infinite; margin:0 auto 16px;
  }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* ITEM */
  .item-emoji {
    font-size:80px; line-height:1; margin-bottom:16px;
    animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }

  .item-name {
    font-size:28px; font-weight:800; margin-bottom:8px; line-height:1.2;
  }
  .item-desc { color:var(--text2); font-size:15px; margin-bottom:6px; }
  .item-cat {
    display:inline-block; background:rgba(79,142,247,0.12);
    border:1px solid rgba(79,142,247,0.25); color:var(--accent);
    border-radius:20px; padding:4px 14px; font-size:13px; margin-bottom:28px;
  }

  .stock-info {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:24px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .stock-num { font-size:36px; font-weight:800; }
  .stock-num.ok { color:var(--success); }
  .stock-num.low { color:var(--warn); }
  .stock-num.empty { color:var(--danger); }
  .stock-label { font-size:13px; color:var(--text2); margin-top:2px; }
  .stock-right { text-align:right; }

  .btn-take {
    width:100%; padding:18px; border-radius:14px; border:none;
    font-family:inherit; font-size:18px; font-weight:700; cursor:pointer;
    transition:all 0.2s; letter-spacing:0.3px;
  }
  .btn-take.active {
    background:var(--success); color:#fff;
    box-shadow:0 8px 24px rgba(34,197,94,0.3);
  }
  .btn-take.active:active { transform:scale(0.97); }
  .btn-take.disabled {
    background:rgba(239,68,68,0.15); color:var(--danger);
    border:1px solid rgba(239,68,68,0.3); cursor:not-allowed;
  }

  /* MANAGED - customer input */
  .customer-wrap { margin-bottom:16px; text-align:right; }
  .customer-wrap label { display:block; font-size:13px; color:var(--text2); margin-bottom:8px; font-weight:500; }
  .customer-wrap input {
    width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; color:var(--text);
    font-family:inherit; font-size:16px; outline:none;
    transition:border-color 0.2s;
  }
  .customer-wrap input:focus { border-color:var(--accent); }

  /* SUCCESS */
  #screenSuccess .big-check {
    font-size:80px; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    margin-bottom:16px;
  }
  #screenSuccess h2 { font-size:24px; font-weight:800; margin-bottom:8px; }
  #screenSuccess p { color:var(--text2); font-size:15px; margin-bottom:28px; }
  .btn-again {
    background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:12px 24px; color:var(--text2);
    font-family:inherit; font-size:15px; cursor:pointer;
  }

  /* ERROR */
  #screenError .big-x { font-size:80px; margin-bottom:16px; }
  #screenError h2 { font-size:22px; font-weight:700; margin-bottom:8px; color:var(--danger); }
  #screenError p { color:var(--text2); font-size:15px; }

  .hidden { display:none; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="screen" id="screenLoading">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:15px">טוען פריט...</div>
</div>

<!-- ITEM -->
<div class="screen hidden" id="screenItem">
  <div class="item-emoji" id="itemEmoji">📦</div>
  <div class="item-name" id="itemName">—</div>
  <div class="item-desc" id="itemDesc">—</div>
  <div class="item-cat" id="itemCat">—</div>

  <div class="stock-info">
    <div>
      <div class="stock-num" id="stockNum">—</div>
      <div class="stock-label">יחידות במלאי</div>
    </div>
    <div class="stock-right">
      <div style="font-size:13px;color:var(--text2)">מינימום</div>
      <div style="font-size:20px;font-weight:700;color:var(--text2)" id="stockMin">—</div>
    </div>
  </div>

  <!-- managed: customer name -->
  <div class="customer-wrap hidden" id="customerWrap">
    <label>שם לקוח (חובה)</label>
    <input type="text" id="customerInput" placeholder="הקלד שם לקוח..." />
  </div>

  <button class="btn-take active" id="btnTake" onclick="takePart()">✓ לקחתי</button>
</div>

<!-- SUCCESS -->
<div class="screen hidden" id="screenSuccess">
  <div class="big-check">✅</div>
  <h2>נרשם בהצלחה</h2>
  <p id="successMsg">נלקח מהמלאי</p>
  <button class="btn-again" onclick="window.location.reload()">סריקה נוספת</button>
</div>

<!-- ERROR -->
<div class="screen hidden" id="screenError">
  <div class="big-x">⚠️</div>
  <h2 id="errorTitle">שגיאה</h2>
  <p id="errorMsg">לא ניתן לטעון את הפריט</p>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxnViFdFHNw9Nqta95W3K7aN8VEtLiJOgvTFl8EjfG7Khw-onDwXRPLD8QkD2NMAL7Kmg/exec';

let currentItem = null;

// Get item ID from URL param
const params = new URLSearchParams(window.location.search);
const itemId = params.get('id');

if (!itemId) {
  showError('קישור שגוי', 'לא נמצא מזהה פריט בקישור');
} else {
  loadItem(itemId);
}

async function loadItem(id) {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=techView&id=${id}`);
    const data = await res.json();
    if (data.error) { showError('פריט לא נמצא', data.error); return; }
    currentItem = data;
    renderItem(data);
  } catch(e) {
    showError('שגיאת חיבור', 'בדוק חיבור לאינטרנט ונסה שוב');
  }
}

function renderItem(item) {
  document.getElementById('itemEmoji').textContent = item.emoji || '📦';
  document.getElementById('itemName').textContent = item.name;
  document.getElementById('itemDesc').textContent = item.desc;
  document.getElementById('itemCat').textContent = item.category;

  const qty = item.qty;
  const min = item.min;
  const numEl = document.getElementById('stockNum');
  numEl.textContent = qty;
  numEl.className = 'stock-num ' + (qty===0?'empty':qty<=min?'low':'ok');
  document.getElementById('stockMin').textContent = min;

  if (qty === 0) {
    const btn = document.getElementById('btnTake');
    btn.textContent = '⛔ אזל מהמלאי';
    btn.className = 'btn-take disabled';
    btn.onclick = null;
  }

  // managed type needs customer name
  if (item.type === 'managed') {
    document.getElementById('customerWrap').classList.remove('hidden');
  }

  show('screenItem');
}

async function takePart() {
  if (!currentItem || currentItem.qty === 0) return;

  const customer = document.getElementById('customerInput')?.value.trim() || '';
  if (currentItem.type === 'managed' && !customer) {
    document.getElementById('customerInput').style.borderColor = 'var(--danger)';
    document.getElementById('customerInput').focus();
    return;
  }

  const btn = document.getElementById('btnTake');
  btn.textContent = '...שומר';
  btn.style.opacity = '0.7';
  btn.onclick = null;

  try {
    const url = `${SCRIPT_URL}?action=take&id=${currentItem.id}&role=טכנאי&customer=${encodeURIComponent(customer)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.success) {
      beep();
      document.getElementById('successMsg').textContent =
        `${currentItem.name} נלקח מהמלאי` + (customer ? ` עבור ${customer}` : '') + `. נותרו ${data.qty} יחידות.`;
      show('screenSuccess');
    } else {
      showError('לא ניתן לקחת', data.msg || 'שגיאה');
    }
  } catch(e) {
    showError('שגיאת חיבור', 'בדוק חיבור לאינטרנט');
  }
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function show(id) {
  ['screenLoading','screenItem','screenSuccess','screenError'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

function showError(title, msg) {
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent = msg;
  show('screenError');
}
</script>
</body>
</html>
