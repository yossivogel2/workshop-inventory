<!DOCTYPE html>
<!-- saved from url=(0060)https://yossivogel2.github.io/workshop-inventory/t.html?id=1 -->
<html lang="he" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>מלאי בית מלאכה</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap');
  :root {
    --bg:#0f1117; --surface:#181c27; --border:#2a3045;
    --accent:#4f8ef7; --success:#22c55e; --danger:#ef4444; --warn:#f59e0b;
    --text:#e8eaf0; --text2:#8b92a8;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .screen { width:100%; max-width:360px; text-align:center; }

  /* LOADING */
  .spinner { width:48px; height:48px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* IMAGE */
  .item-img {
    width:160px; height:160px; border-radius:20px; margin:0 auto 16px;
    object-fit:cover; border:2px solid var(--border);
    animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .item-emoji { font-size:80px; line-height:1; margin-bottom:16px; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }

  .item-name { font-size:26px; font-weight:800; margin-bottom:6px; line-height:1.2; }
  .item-desc { color:var(--text2); font-size:14px; margin-bottom:6px; }
  .item-cat { display:inline-block; background:rgba(79,142,247,0.12); border:1px solid rgba(79,142,247,0.25); color:var(--accent); border-radius:20px; padding:4px 14px; font-size:13px; margin-bottom:20px; }

  .stock-info { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
  .stock-num { font-size:34px; font-weight:800; }
  .stock-num.ok { color:var(--success); }
  .stock-num.low { color:var(--warn); }
  .stock-num.empty { color:var(--danger); }
  .stock-label { font-size:12px; color:var(--text2); margin-top:2px; }
  .stock-right { text-align:left; }

  /* USER BADGE */
  .user-badge { display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:5px 14px; font-size:13px; color:var(--text2); margin-bottom:16px; }
  .user-badge.manager { border-color:var(--accent2,#2dd4bf); color:var(--accent2,#2dd4bf); }

  .form-group { margin-bottom:14px; text-align:right; }
  .form-group label { display:block; font-size:13px; color:var(--text2); margin-bottom:6px; font-weight:500; }
  .form-group input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; color:var(--text); font-family:inherit; font-size:16px; outline:none; transition:border-color 0.2s; }
  .form-group input:focus { border-color:var(--accent); }

  .btn-take { width:100%; padding:18px; border-radius:14px; border:none; font-family:inherit; font-size:18px; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .btn-take.active { background:var(--success); color:#fff; box-shadow:0 8px 24px rgba(34,197,94,0.3); }
  .btn-take.active:active { transform:scale(0.97); }
  .btn-take.disabled { background:rgba(239,68,68,0.15); color:var(--danger); border:1px solid rgba(239,68,68,0.3); cursor:not-allowed; }
  .btn-take.manager-only { background:rgba(79,142,247,0.15); color:var(--accent); border:1px solid rgba(79,142,247,0.3); cursor:not-allowed; }

  /* SUCCESS */
  .big-check { font-size:80px; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); margin-bottom:16px; }
  #screenSuccess h2 { font-size:24px; font-weight:800; margin-bottom:8px; }
  #screenSuccess p { color:var(--text2); font-size:15px; margin-bottom:28px; }
  .btn-again { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 24px; color:var(--text2); font-family:inherit; font-size:15px; cursor:pointer; }

  /* ERROR */
  .big-x { font-size:80px; margin-bottom:16px; }
  #screenError h2 { font-size:22px; font-weight:700; margin-bottom:8px; color:var(--danger); }
  #screenError p { color:var(--text2); font-size:15px; }

  .hidden { display:none; }
</style>
</head>
<body>

<div class="screen hidden" id="screenLoading">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:15px">טוען פריט...</div>
</div>

<div class="screen" id="screenItem">
  <div id="itemImageWrap"><img class="item-img" src="./t_files/IMG20260601161434.jpg" onerror="this.parentElement.innerHTML=&#39;&lt;div class=item-emoji&gt;💧&lt;/div&gt;&#39;"></div>
  <div class="item-name" id="itemName">פילטר מים</div>
  <div class="item-desc" id="itemDesc">פילטר סטנדרטי</div>
  <div class="item-cat" id="itemCat">מכונת קרח</div>

  <div class="user-badge" id="userBadge" style="display: none;">👤 <span id="userName">—</span></div>

  <div class="stock-info">
    <div>
      <div class="stock-num ok" id="stockNum">9</div>
      <div class="stock-label">יחידות במלאי</div>
    </div>
    <div class="stock-right">
      <div style="font-size:12px;color:var(--text2)">מינימום</div>
      <div style="font-size:20px;font-weight:700;color:var(--text2)" id="stockMin">4</div>
    </div>
  </div>

  <div class="form-group hidden" id="customerWrap">
    <label>שם לקוח (חובה)</label>
    <input type="text" id="customerInput" placeholder="הקלד שם לקוח...">
  </div>

  <button class="btn-take active" id="btnTake" onclick="takePart()">✓ לקחתי</button>
</div>

<div class="screen hidden" id="screenSuccess">
  <div class="big-check">✅</div>
  <h2>נרשם בהצלחה</h2>
  <p id="successMsg"></p>
  <button class="btn-again" onclick="window.location.reload()">סריקה נוספת</button>
</div>

<div class="screen hidden" id="screenError">
  <div class="big-x">⚠️</div>
  <h2 id="errorTitle">שגיאה</h2>
  <p id="errorMsg"></p>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxEHjjGDnBabN6Vc2XBHvxFfN70Zz9fwhSrLShTG5RHauCwBdYWcuDXyhteTM9kCe8KmA/exec';

const params = new URLSearchParams(window.location.search);
const itemId = params.get('id');
const userName = params.get('user') || '';
const userRole = params.get('role') || 'tech'; // 'tech' or 'manager'

let currentItem = null;

if (!itemId) {
  showError('קישור שגוי', 'לא נמצא מזהה פריט בקישור');
} else {
  loadItem(itemId);
}

async function loadItem(id) {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=techView&id=${id}`);
    const data = await res.json();
    if (data.error) { showError('פריט לא נמצא', data.error); return; }
    currentItem = data;
    renderItem(data);
  } catch(e) {
    showError('שגיאת חיבור', 'בדוק חיבור לאינטרנט ונסה שוב');
  }
}

function renderItem(item) {
  // Image or emoji
  const imgWrap = document.getElementById('itemImageWrap');
  if (item.image) {
    imgWrap.innerHTML = `<img class="item-img" src="${item.image}" onerror="this.parentElement.innerHTML='<div class=item-emoji>${item.emoji||'📦'}</div>'" />`;
  } else {
    imgWrap.innerHTML = `<div class="item-emoji">${item.emoji || '📦'}</div>`;
  }

  document.getElementById('itemName').textContent = item.name;
  document.getElementById('itemDesc').textContent = item.desc;
  document.getElementById('itemCat').textContent = item.category;

  // User badge
  const badge = document.getElementById('userBadge');
  const nameEl = document.getElementById('userName');
  if (userName) {
    nameEl.textContent = userName;
    if (userRole === 'manager') badge.classList.add('manager');
  } else {
    badge.style.display = 'none';
  }

  // Stock
  const qty = item.qty;
  const min = item.min;
  const numEl = document.getElementById('stockNum');
  numEl.textContent = qty;
  numEl.className = 'stock-num ' + (qty===0?'empty':qty<=min?'low':'ok');
  document.getElementById('stockMin').textContent = min;

  const btn = document.getElementById('btnTake');

  if (qty === 0) {
    btn.textContent = '⛔ אזל מהמלאי';
    btn.className = 'btn-take disabled';
    btn.onclick = null;
    return;
  }

  // Managed item – only managers can take
  if (item.type === 'managed') {
    if (userRole !== 'manager') {
      btn.textContent = '🔒 לקיחה דרך מנהל בלבד';
      btn.className = 'btn-take manager-only';
      btn.onclick = null;
      return;
    }
    // Manager taking managed item – needs customer name
    document.getElementById('customerWrap').classList.remove('hidden');
  }

  show('screenItem');
}

async function takePart() {
  if (!currentItem || currentItem.qty === 0) return;

  const customer = document.getElementById('customerInput')?.value.trim() || '';
  if (currentItem.type === 'managed' && !customer) {
    document.getElementById('customerInput').style.borderColor = 'var(--danger)';
    document.getElementById('customerInput').focus();
    return;
  }

  const btn = document.getElementById('btnTake');
  btn.textContent = '...שומר';
  btn.style.opacity = '0.7';
  btn.onclick = null;

  try {
    const url = `${SCRIPT_URL}?action=take&id=${currentItem.id}&role=${encodeURIComponent(userName||userRole)}&customer=${encodeURIComponent(customer)}`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.success) {
      beep();
      let msg = `${currentItem.name} נלקח`;
      if (userName) msg += ` על ידי ${userName}`;
      if (customer) msg += ` עבור ${customer}`;
      msg += `. נותרו ${data.qty} יחידות.`;
      document.getElementById('successMsg').textContent = msg;
      show('screenSuccess');
    } else {
      showError('לא ניתן לקחת', data.msg || 'שגיאה');
    }
  } catch(e) {
    showError('שגיאת חיבור', 'בדוק חיבור לאינטרנט');
  }
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function show(id) {
  ['screenLoading','screenItem','screenSuccess','screenError'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

function showError(title, msg) {
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent = msg;
  show('screenError');
}
</script>


</body></html>
